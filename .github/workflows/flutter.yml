name: Flutter CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - run: flutter build web
