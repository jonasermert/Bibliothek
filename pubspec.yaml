name: bibliothek
description: Eine moderne Flutter-Bibliotheksapp auf Basis der Open Library API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  go_router: ^17.0.0
  flutter_rating_bar: ^4.0.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
